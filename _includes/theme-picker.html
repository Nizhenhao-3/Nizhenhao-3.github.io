<template id="home-theme-template">
  <fieldset class="theme-picker">
    <legend class="sr-only">Color theme</legend>
    <label><input type="radio" name="color-theme" value="system" checked><span>Auto</span><span class="sr-only"> — follow system</span></label>
    <label><input type="radio" name="color-theme" value="light"><span>Day</span><span class="sr-only"> — light theme</span></label>
    <label><input type="radio" name="color-theme" value="dark"><span>Night</span><span class="sr-only"> — dark theme</span></label>
  </fieldset>
</template>
